# E2E Test Environment Configuration
# This file contains settings for running E2E tests with H2 in-memory database

# Server Configuration
server.port=8080

# Database Configuration (H2 in-memory for E2E testing)
spring.datasource.url=jdbc:h2:mem:e2edb;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# SQL Initialization
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=false

# JWT Configuration (E2E test values)
jwt.secret=e2eTestSecretKeyForE2ETestsOnly_ThisMustBeAtLeast64Characters1234567890123456789012345678901234567890
jwt.expiration=86400000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false

# CORS Configuration (allow frontend during E2E tests)
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Spring Web Configuration
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/static/**

# Logging Configuration
logging.level.root=INFO
logging.level.com.chatapp=DEBUG
logging.level.org.springframework.security=DEBUG
