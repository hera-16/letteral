      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: エラーコード
              example: VALIDATION_FAILED
            message:
              type: string
              description: エラーメッセージ
              example: 入力値が不正です
            details:
              type: object
              description: エラー詳細
              additionalProperties: true
            timestamp:
              type: string
              format: date-time
              example: '2024-01-20T10:30:00Z'
            path:
              type: string
              description: リクエストパス
              example: /api/v1/posts

  responses:
    BadRequest:
      description: リクエスト不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_FAILED
              message: 入力値が不正です
              details:
                content: 投稿内容は1文字以上10000文字以内で入力してください
              timestamp: '2024-01-20T10:30:00Z'
              path: /api/v1/posts

    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_TOKEN_EXPIRED
              message: 認証トークンの有効期限が切れています
              timestamp: '2024-01-20T10:30:00Z'
              path: /api/v1/posts

    Forbidden:
      description: 権限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_INSUFFICIENT_PERMISSION
              message: この操作を実行する権限がありません
              details:
                required: ORG_ADMIN
                current: MEMBER
              timestamp: '2024-01-20T10:30:00Z'
              path: /api/v1/organizations/org_456/members/invite

    NotFound:
      description: リソース未存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: 指定されたリソースが見つかりません
              timestamp: '2024-01-20T10:30:00Z'
              path: /api/v1/posts/post_999

    UnprocessableEntity:
      description: 処理不可（ビジネスロジックエラー）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
