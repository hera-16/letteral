openapi: 3.0.3
info:
  title: Letteral API
  description: |
    企業向け匿名進捗共有プラットフォーム「Letteral」のバックエンドAPI仕様書

    ## 主要機能
    - マルチテナント対応（企業・組織単位の完全分離）
    - 匿名プロファイル管理（組織ごとに異なる匿名ID）
    - 進捗投稿・タイムライン
    - OKR管理・進捗リンク
    - 評価スナップショット・分析
    - 監査ログ記録
  version: 1.0.0
  contact:
    name: Letteral Support
    email: support@letteral.com
  license:
    name: Proprietary

servers:
  - url: https://api.letteral.com/v1
    description: Production server
  - url: https://api-staging.letteral.com/v1
    description: Staging server
  - url: http://localhost:8080/v1
    description: Local development server

tags:
  - name: Tenants
    description: テナント（企業）管理
  - name: Organizations
    description: 組織（部署）管理
  - name: Members
    description: メンバー管理
  - name: Anonymous Profiles
    description: 匿名プロファイル管理
  - name: Posts
    description: 進捗投稿管理
  - name: Reactions
    description: リアクション管理
  - name: OKRs
    description: OKR（Objectives and Key Results）管理
  - name: Evaluations
    description: 評価・スナップショット管理
  - name: Analytics
    description: 分析・統計データ
  - name: Audit Logs
    description: 監査ログ管理
  - name: Policies
    description: ポリシー設定管理

security:
  - BearerAuth: []
  - TenantId: []

paths:
  # =============================================
  # テナント管理API
  # =============================================
  /tenants:
    post:
      tags:
        - Tenants
      summary: テナント登録
      description: 新しいテナント（企業）を登録します
      operationId: createTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: テナント作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tenants/{tenantId}:
    get:
      tags:
        - Tenants
      summary: テナント情報取得
      description: 指定したテナントの詳細情報を取得します
      operationId: getTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: テナント取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Tenants
      summary: テナント設定更新
      description: テナントの設定を更新します
      operationId: updateTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # =============================================
  # 組織管理API
  # =============================================
  /organizations:
    post:
      tags:
        - Organizations
      summary: 組織作成
      description: テナント内に新しい組織（部署）を作成します
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: 組織作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/tree:
    get:
      tags:
        - Organizations
      summary: 組織階層取得
      description: テナント内の組織を階層構造で取得します
      operationId: getOrganizationTree
      parameters:
        - name: rootId
          in: query
          description: ルート組織ID（指定しない場合は全階層）
          schema:
            type: string
        - name: maxDepth
          in: query
          description: 最大階層深度
          schema:
            type: integer
            minimum: 1
            maximum: 10
      responses:
        '200':
          description: 組織階層取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTreeResponse'

  /organizations/{orgId}/members:
    get:
      tags:
        - Members
      summary: メンバー一覧取得
      description: 組織のメンバー一覧を取得します
      operationId: getOrganizationMembers
      parameters:
        - $ref: '#/components/parameters/OrgIdPath'
        - name: role
          in: query
          description: 役割フィルタ
          schema:
            $ref: '#/components/schemas/MemberRole'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: メンバー一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPageResponse'

  /organizations/{orgId}/members/invite:
    post:
      tags:
        - Members
      summary: メンバー招待
      description: 組織にメンバーを招待します
      operationId: inviteMember
      parameters:
        - $ref: '#/components/parameters/OrgIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: 招待成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # =============================================
  # 匿名プロファイル管理API
  # =============================================
  /anonymous-profiles/me:
    get:
      tags:
        - Anonymous Profiles
      summary: 匿名プロファイル取得
      description: 現在のユーザーの全組織における匿名プロファイルを取得します
      operationId: getMyAnonymousProfiles
      parameters:
        - name: organizationId
          in: query
          description: 特定組織のプロファイルのみ取得
          schema:
            type: string
      responses:
        '200':
          description: プロファイル取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousProfileListResponse'

  /anonymous-profiles/{profileId}/activate:
    post:
      tags:
        - Anonymous Profiles
      summary: 匿名プロファイル切り替え
      description: 特定組織での匿名プロファイルをアクティブ化します
      operationId: activateAnonymousProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 切り替え成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousProfileResponse'

  # =============================================
  # 進捗投稿API
  # =============================================
  /posts:
    get:
      tags:
        - Posts
      summary: タイムライン取得
      description: 投稿のタイムラインを取得します
      operationId: getPosts
      parameters:
        - name: organizationId
          in: query
          description: 組織フィルタ
          schema:
            type: string
        - name: postType
          in: query
          description: 投稿タイプフィルタ
          schema:
            $ref: '#/components/schemas/PostType'
        - name: visibilityScope
          in: query
          description: 公開範囲フィルタ
          schema:
            $ref: '#/components/schemas/VisibilityScope'
        - name: startDate
          in: query
          description: 開始日時（ISO 8601形式）
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: 終了日時（ISO 8601形式）
          schema:
            type: string
            format: date-time
        - name: tags
          in: query
          description: タグフィルタ（カンマ区切り）
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: タイムライン取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPageResponse'

    post:
      tags:
        - Posts
      summary: 投稿作成
      description: 新しい進捗投稿を作成します
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: 投稿作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /posts/{postId}:
    get:
      tags:
        - Posts
      summary: 投稿詳細取得
      description: 指定した投稿の詳細情報を取得します
      operationId: getPost
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: 投稿取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Posts
      summary: 投稿更新
      description: 投稿を更新します
      operationId: updatePost
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'

    delete:
      tags:
        - Posts
      summary: 投稿削除
      description: 投稿を削除します
      operationId: deletePost
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204':
          description: 削除成功

  /posts/{postId}/reactions:
    post:
      tags:
        - Reactions
      summary: リアクション追加
      description: 投稿にリアクションを追加します
      operationId: addReaction
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReactionRequest'
      responses:
        '201':
          description: リアクション追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResponse'

  /posts/{postId}/reactions/{reactionId}:
    delete:
      tags:
        - Reactions
      summary: リアクション削除
      description: リアクションを削除します
      operationId: deleteReaction
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
        - name: reactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功

  # =============================================
  # OKR管理API
  # =============================================
  /okrs/objectives:
    get:
      tags:
        - OKRs
      summary: Objective一覧取得
      description: Objective一覧を取得します
      operationId: getObjectives
      parameters:
        - name: organizationId
          in: query
          description: 組織フィルタ
          schema:
            type: string
        - name: quarter
          in: query
          description: 四半期フィルタ（例：2024_Q1）
          schema:
            type: string
        - name: status
          in: query
          description: ステータスフィルタ
          schema:
            $ref: '#/components/schemas/OkrStatus'
        - name: ownerId
          in: query
          description: 所有者フィルタ
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Objective一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectivePageResponse'

    post:
      tags:
        - OKRs
      summary: Objective作成
      description: 新しいObjectiveを作成します
      operationId: createObjective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectiveRequest'
      responses:
        '201':
          description: Objective作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveResponse'

  /okrs/objectives/{objectiveId}/key-results:
    post:
      tags:
        - OKRs
      summary: Key Result作成
      description: ObjectiveにKey Resultを追加します
      operationId: createKeyResult
      parameters:
        - name: objectiveId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyResultRequest'
      responses:
        '201':
          description: Key Result作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyResultResponse'

  /okrs/key-results/{krId}/progress:
    patch:
      tags:
        - OKRs
      summary: Key Result進捗更新
      description: Key Resultの進捗を更新します
      operationId: updateKeyResultProgress
      parameters:
        - name: krId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyResultProgressRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyResultResponse'

  /okrs/objectives/{objectiveId}/link-post:
    post:
      tags:
        - OKRs
      summary: 投稿とOKRのリンク作成
      description: 進捗投稿をObjectiveにリンクします
      operationId: linkPostToObjective
      parameters:
        - name: objectiveId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPostRequest'
      responses:
        '201':
          description: リンク作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOkrLinkResponse'

  # =============================================
  # 評価・分析API
  # =============================================
  /evaluations/snapshots:
    post:
      tags:
        - Evaluations
      summary: 評価スナップショット作成
      description: ユーザーの評価を記録します
      operationId: createEvaluationSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationSnapshotRequest'
      responses:
        '201':
          description: 評価記録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSnapshotResponse'

  /evaluations/users/{userId}/history:
    get:
      tags:
        - Evaluations
      summary: ユーザー評価履歴取得
      description: 指定ユーザーの評価履歴を取得します
      operationId: getUserEvaluationHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: startPeriod
          in: query
          description: 開始期間
          schema:
            type: string
        - name: endPeriod
          in: query
          description: 終了期間
          schema:
            type: string
      responses:
        '200':
          description: 評価履歴取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationHistoryResponse'

  /analytics/organizations/{orgId}/stats:
    get:
      tags:
        - Analytics
      summary: 組織統計取得
      description: 組織のアクティビティ統計を取得します
      operationId: getOrganizationStats
      parameters:
        - $ref: '#/components/parameters/OrgIdPath'
        - name: startDate
          in: query
          required: true
          description: 集計開始日時（ISO 8601形式）
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: true
          description: 集計終了日時（ISO 8601形式）
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 統計取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationStatsResponse'

  /analytics/okrs/dashboard:
    get:
      tags:
        - Analytics
      summary: OKR進捗ダッシュボード
      description: OKRの進捗状況をダッシュボード形式で取得します
      operationId: getOkrDashboard
      parameters:
        - name: organizationId
          in: query
          description: 組織フィルタ
          schema:
            type: string
        - name: quarter
          in: query
          required: true
          description: 四半期指定（例：2024_Q1）
          schema:
            type: string
      responses:
        '200':
          description: ダッシュボード取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkrDashboardResponse'

  # =============================================
  # 監査ログAPI
  # =============================================
  /audit-logs:
    get:
      tags:
        - Audit Logs
      summary: 監査ログ検索
      description: 監査ログを検索・取得します
      operationId: getAuditLogs
      parameters:
        - name: action
          in: query
          description: アクションフィルタ
          schema:
            type: string
        - name: targetType
          in: query
          description: 対象タイプフィルタ
          schema:
            type: string
        - name: targetId
          in: query
          description: 対象IDフィルタ
          schema:
            type: string
        - name: userId
          in: query
          description: 実行ユーザーフィルタ
          schema:
            type: string
        - name: startDate
          in: query
          description: 開始日時（ISO 8601形式）
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: 終了日時（ISO 8601形式）
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 監査ログ取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageResponse'

    post:
      tags:
        - Audit Logs
      summary: 監査ログ記録
      description: システム操作の監査ログを記録します（主にシステム内部から自動呼び出し）
      operationId: createAuditLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditLogRequest'
      responses:
        '201':
          description: ログ記録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'

  # =============================================
  # ポリシー設定API
  # =============================================
  /policies:
    get:
      tags:
        - Policies
      summary: ポリシー設定取得
      description: 組織のポリシー設定を取得します
      operationId: getPolicies
      parameters:
        - name: organizationId
          in: query
          required: true
          description: 組織ID
          schema:
            type: string
      responses:
        '200':
          description: ポリシー取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'

  /policies/{policyId}:
    patch:
      tags:
        - Policies
      summary: ポリシー設定更新
      description: ポリシー設定を更新します
      operationId: updatePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT認証トークン
    TenantId:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: テナントID（マルチテナント分離用）

  parameters:
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      description: テナントID
      schema:
        type: string

    OrgIdPath:
      name: orgId
      in: path
      required: true
      description: 組織ID
      schema:
        type: string

    PostIdPath:
      name: postId
      in: path
      required: true
      description: 投稿ID
      schema:
        type: string

    Page:
      name: page
      in: query
      description: ページ番号（0始まり）
      schema:
        type: integer
        default: 0
        minimum: 0

    Size:
      name: size
      in: query
      description: 1ページあたりの件数
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    Sort:
      name: sort
      in: query
      description: ソート順（フィールド名,方向）
      schema:
        type: string
        example: createdAt,desc

  schemas:
    # =============================================
    # Enum定義
    # =============================================
    TenantPlan:
      type: string
      enum:
        - FREE
        - PROFESSIONAL
        - ENTERPRISE
      description: テナントプラン

    TenantStatus:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - TRIAL
        - EXPIRED
      description: テナントステータス

    MemberRole:
      type: string
      enum:
        - SYSTEM_ADMIN
        - TENANT_ADMIN
        - ORG_ADMIN
        - MEMBER
      description: メンバー役割

    PostType:
      type: string
      enum:
        - DAILY_REPORT
        - WEEKLY_SUMMARY
        - CHALLENGE_UPDATE
        - ACHIEVEMENT
      description: 投稿タイプ

    VisibilityScope:
      type: string
      enum:
        - PRIVATE
        - ORGANIZATION
        - TENANT
