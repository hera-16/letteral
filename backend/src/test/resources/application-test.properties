# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional for debugging)
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration - Disable for tests (using create-drop)
spring.flyway.enabled=false

# JWT Configuration (HS512 requires 512 bits / 64 characters minimum)
app.jwt.secret=test_jwt_secret_key_for_testing_purposes_minimum_512_bits_required_for_hs512_algorithm_secure_token_generation_64chars
app.jwt.expiration=3600000

# Logging
logging.level.com.chatapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
