name: CI - Comprehensive Test Suite

permissions:
  checks: write
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  # ========================================
  # バックエンド ユニットテスト
  # ========================================
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: |
          cd backend
          mvn clean test -Dmaven.test.failure.ignore=true
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Generate JaCoCo coverage report
        if: always()
        run: |
          cd backend
          mvn jacoco:report

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-results
          path: backend/target/surefire-reports/
          retention-days: 30

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Test Results
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

  # ========================================
  # バックエンド 統合テスト
  # ========================================
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: chatapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        run: |
          cd backend
          mvn clean verify -P integration-tests -Dmaven.test.failure.ignore=true
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: chatapp
          DB_USER: root
          DB_PASSWORD: testpassword

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-test-results
          path: backend/target/failsafe-reports/
          retention-days: 30

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Integration Test Results
          path: backend/target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

  # ========================================
  # フロントエンド ユニットテスト
  # ========================================
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --passWithNoTests --runInBand

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # ========================================
  # E2Eテスト (Playwright)
  # ========================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-unit-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: chatapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Resolve backend dependencies
        run: |
          cd backend
          echo "Downloading Maven dependencies..."
          mvn dependency:go-offline -B -q || mvn dependency:resolve -B
        env:
          MAVEN_OPTS: "-Xmx512m"

      - name: Build backend JAR
        run: |
          cd backend
          echo "Building backend JAR..."
          mvn clean package -DskipTests -B -q
        env:
          MAVEN_OPTS: "-Xmx512m"

      - name: Start backend server
        run: |
          cd backend
          echo "Starting backend server..."
          nohup java -jar \
            -Dspring.profiles.active=test \
            -Dspring.datasource.url=jdbc:h2:mem:ci;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE \
            -Dspring.datasource.driver-class-name=org.h2.Driver \
            -Dspring.jpa.hibernate.ddl-auto=update \
            -Dspring.flyway.enabled=true \
            -Dserver.port=8080 \
            -Xmx512m \
            target/*.jar > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend PID: $(cat backend.pid)"

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to start..."
          MAX_ATTEMPTS=120
          SLEEP_INTERVAL=5

          for i in $(seq 1 $MAX_ATTEMPTS); do
            # Check if process is still running
            if [ -f backend/backend.pid ]; then
              PID=$(cat backend/backend.pid)
              if ! kill -0 $PID 2>/dev/null; then
                echo "ERROR: Backend process died!"
                echo "=== Last 50 lines of backend log ==="
                tail -n 50 backend/backend.log || true
                exit 1
              fi
            fi

            # Try health check
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              echo "Startup took approximately $((i * SLEEP_INTERVAL)) seconds"
              exit 0
            fi

            # Show progress
            if [ $((i % 6)) -eq 0 ]; then
              echo "Attempt $i/$MAX_ATTEMPTS: Still waiting... (${i}0s elapsed)"
              # Show last line of log for progress indication
              tail -n 1 backend/backend.log 2>/dev/null || true
            fi

            sleep $SLEEP_INTERVAL
          done

          echo "ERROR: Backend failed to start within $((MAX_ATTEMPTS * SLEEP_INTERVAL)) seconds"
          echo "=== Full backend log ==="
          cat backend/backend.log || true
          exit 1

      - name: Start frontend server
        run: |
          nohup npm run start > frontend.log 2>&1 &
          echo $! > frontend.pid
        env:
          PORT: 3000

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to start..."
          MAX_ATTEMPTS=60
          SLEEP_INTERVAL=5

          for i in $(seq 1 $MAX_ATTEMPTS); do
            # Check if process is still running
            if [ -f frontend.pid ]; then
              PID=$(cat frontend.pid)
              if ! kill -0 $PID 2>/dev/null; then
                echo "ERROR: Frontend process died!"
                echo "=== Last 50 lines of frontend log ==="
                tail -n 50 frontend.log || true
                exit 1
              fi
            fi

            # Try health check
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              echo "Startup took approximately $((i * SLEEP_INTERVAL)) seconds"
              exit 0
            fi

            # Show progress every 30 seconds
            if [ $((i % 6)) -eq 0 ]; then
              echo "Attempt $i/$MAX_ATTEMPTS: Still waiting... ($((i * SLEEP_INTERVAL))s elapsed)"
            fi

            sleep $SLEEP_INTERVAL
          done

          echo "ERROR: Frontend failed to start within $((MAX_ATTEMPTS * SLEEP_INTERVAL)) seconds"
          echo "=== Full frontend log ==="
          cat frontend.log || true
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: playwright-report/
          retention-days: 30

      - name: Upload server logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-logs
          path: |
            backend/backend.log
            frontend.log
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          echo "Stopping servers..."
          if [ -f backend/backend.pid ]; then
            PID=$(cat backend/backend.pid)
            echo "Stopping backend (PID: $PID)"
            kill $PID || true
            # Wait for graceful shutdown
            for i in {1..10}; do
              if ! kill -0 $PID 2>/dev/null; then
                echo "Backend stopped gracefully"
                break
              fi
              sleep 1
            done
            # Force kill if still running
            kill -9 $PID 2>/dev/null || true
          fi
          if [ -f frontend.pid ]; then
            PID=$(cat frontend.pid)
            echo "Stopping frontend (PID: $PID)"
            kill $PID || true
          fi

  # ========================================
  # テスト結果サマリー
  # ========================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests, e2e-tests]
    if: always()

    steps:
      - name: Check all test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit Tests | ${{ needs.backend-unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Integration Tests | ${{ needs.backend-integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Unit Tests | ${{ needs.frontend-unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.backend-integration-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some tests failed. Please check the logs above.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
          fi
